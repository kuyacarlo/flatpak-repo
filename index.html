<h1>Dock Flatpak</h1>
<p><a href="dock.flatpakrepo">Add the Dock repository</a></p>
<p>Or run <code>flatpak remote-add --user --if-not-exists dock https://kuyacarlo.github.io/flatpak-repo/dock.flatpakrepo</code>, then <code>flatpak install dock dev.kuyacarlo.Dock</code>.</p>
<p>Updates are delivered with <code>flatpak update</code>.</p>
